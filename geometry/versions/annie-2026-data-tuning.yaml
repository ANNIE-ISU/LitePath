name: annie-2026-data-tuning
status: draft
description: >-
  Working version for tuning PMT, LAPPD and surfboard positions in
  litepath geometry-viz: annie-2026-data plus the offsets in
  metrology-draft.yaml (the working file). When a state is good, freeze it
  with litepath geometry snapshot (see docs/GEOMETRY_TUNING.md); the
  pre-2026-11 corrections are archived as annie-2026-data-v0.1.
inputs:
  pmt_table: geometry/base/FullTankPMTGeometry.csv
  structure: PHASE2_INNER_STRUCTURE_closed.gdml
settings:
  bottom_spin_deg: 22.5
  z_offset_mm: 0.0
  lappd_model: annie
  surfboards: 3
  structure_mesh: true
  pmt_meshes: true
  lappds: true
overlays:
  - geometry/overlays/metrology-draft.yaml
