[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "litepath"
version = "0.1.0"
description = "GPU-accelerated ray tracer for ANNIE detector"
requires-python = ">=3.11"
dependencies = [
    "taichi>=1.7",
    "numpy>=1.24",
    "h5py>=3",
    "lxml>=5",
    "cadquery>=2",
    "pyyaml>=6",
]

[project.scripts]
litepath = "litepath.cli:main"

[project.optional-dependencies]
# WAGLE ROOT parsing for `litepath benchmark`
benchmark = [
    "uproot>=5",
    "awkward>=2",
]

[tool.setuptools.packages.find]
include = ["litepath*"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: end-to-end tests that build detector geometry and run the GPU kernel",
]
